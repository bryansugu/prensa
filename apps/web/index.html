<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Prensa, del Centro de Diseño y Comunicación, comprime tus PDF en tu propio dispositivo, con la mejor calidad y sin subir nada a internet."
    />
    <title>Prensa · Compresor PDF · Centro de Diseño</title>
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="icon" href="/icon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" type="image/png" />
    <link
      rel="preload"
      href="/fonts/PPNeueMontreal-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Aplica el tema antes del primer render para evitar el flash.
      (function () {
        try {
          var pref = localStorage.getItem("prensa:theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
