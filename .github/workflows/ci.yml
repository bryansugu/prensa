name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prensa/web cf:types
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @prensa/web build

  container-image:
    name: Imagen del motor (Docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prensa/web build:container
      - uses: docker/setup-buildx-action@v3
      - name: docker build
        run: docker build --progress=plain -t prensa-engine:ci apps/web/container
      - name: smoke test del runner
        run: |
          docker run -d --name engine -p 8080:8080 -e INTERNAL_SECRET=ci prensa-engine:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | tee health.json
          node -e "const h=require('./health.json'); for (const t of ['gs','ocrmypdf','qpdf','jbig2','tesseract']) if(!h.tools[t]) { console.error('falta', t); process.exit(1) }"
          docker logs engine
